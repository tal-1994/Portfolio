<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Source of Truth: Rebuilding Agora's Design System · Tal Yanay</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Gallery (light) — ported from the homepage + approved hero so the body
     reads as one room. Monochrome shell; colour comes only from the real
     screenshots that drop into the media containers. */
  --ground:#f6f7f7; --ground-2:#ebedee;
  --ink:#141414; --ink-2:#4f5258; --ink-3:#646770;
  --media:#e7e9ec; --line:rgba(20,20,20,.10);
  --display:"Bricolage Grotesque",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --maxw:1280px; --gutter:clamp(22px,5vw,80px); --read:64ch;
  --ease:cubic-bezier(.22,.9,.26,1); --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;color-scheme:light}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.6;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;overflow-x:hidden;}
img{max-width:100%;display:block}
a{color:inherit}
::selection{background:var(--ink);color:var(--ground)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
/* nav — ported from the homepage "Gallery (light)" shell (literal values,
   kept out of this page's own tokens which the body content depends on) */
.nav{position:sticky;top:0;z-index:100;background:#f6f7f7;
  border-bottom:1px solid transparent;
  transition:background .45s cubic-bezier(.22,.9,.26,1),
             border-color .45s cubic-bezier(.22,.9,.26,1),
             backdrop-filter .45s cubic-bezier(.22,.9,.26,1)}
.nav.scrolled{background:color-mix(in srgb,#f6f7f7 72%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  backdrop-filter:saturate(1.4) blur(14px);
  border-bottom-color:rgba(20,20,20,.10)}
.nav-in{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding-block:clamp(16px,2vw,22px)}
.wordmark{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:600;
  font-size:1.06rem;letter-spacing:-.01em;color:#141414;text-decoration:none}
.wordmark span{color:#646770;font-family:'Inter',system-ui,sans-serif;
  font-weight:400;font-size:.86rem;margin-left:.55rem}
.nav-links{display:flex;align-items:baseline;gap:clamp(1.1rem,2.6vw,2.2rem)}
.nav-links a{color:#4f5258;font-size:.95rem;text-decoration:none;
  transition:color .25s cubic-bezier(.22,.9,.26,1)}
.nav-links a:hover{color:#141414}
.nav-links a.cta{color:#141414;font-weight:500;position:relative}
.nav-links a.cta::after{content:"";position:absolute;left:0;right:0;bottom:-3px;
  height:1.5px;background:#141414;transform:scaleX(0);transform-origin:left;
  transition:transform .35s cubic-bezier(.22,1,.36,1)}
@media (max-width:560px){.wordmark span{display:none}}
/* homepage shell — matches the homepage/hero chrome width + gutters */
.shell{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}

/* editorial type — Bricolage display, Inter body (same as the homepage) */
h1{font-family:var(--display);font-weight:600;letter-spacing:-.035em;line-height:.96;margin:0;color:var(--ink)}
h2{font-family:var(--display);font-weight:600;letter-spacing:-.025em;line-height:1.05;
  font-size:clamp(1.6rem,3.4vw,2.9rem);margin:0;color:var(--ink);text-wrap:balance}
h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.1;
  font-size:clamp(1.35rem,2.1vw,1.85rem);margin:0;color:var(--ink);text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-3)}

/* ===========================================================================
   HERO — rebuilt into the homepage "Gallery (light)" world: a monochrome shell
   (cool soft white ground, near-black ink, Bricolage display), an editorial
   split, and one art-directed composition of the real system — Storybook, the
   Figma states matrix, the Input properties panel and the semantic tokens,
   composed in Figma and exported as a single transparent image (shadows baked in)
   that drops onto the ground. Literal homepage values, kept out of this page's own
   --tokens that the body content below still depends on.
   =========================================================================== */
.cs-hero{background:#f6f7f7;padding:clamp(40px,7vw,96px) 0 clamp(52px,8vw,112px)}
.cs-hero-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
  gap:clamp(36px,5vw,80px);align-items:center}

/* text column */
.cs-hero-copy{max-width:36rem}
.cs-label{font-size:.8125rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  color:#646770;margin:0 0 1.2rem}
.cs-hero h1{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:600;
  font-size:clamp(2.4rem,4.6vw,4.4rem);line-height:.96;letter-spacing:-.035em;
  color:#141414;margin:0;text-wrap:balance}
.cs-sub{margin:clamp(20px,2.4vw,30px) 0 0;font-size:clamp(1.08rem,1.35vw,1.26rem);
  line-height:1.5;color:#4f5258;max-width:40ch;text-wrap:pretty}
.cs-meta{margin:clamp(28px,3.4vw,46px) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:1rem 2.4rem}
.cs-meta>div{display:flex;flex-direction:column;gap:.18rem}
.cs-meta dt{font-size:.8125rem;color:#646770}
.cs-meta dd{margin:0;font-size:.98rem;line-height:1.3;color:#141414;font-weight:500}

/* the composition — one combined Figma image (Storybook, the states matrix, the Input
   properties panel and the semantic tokens arranged as a single transparent PNG with
   its shadows baked in), dropped straight onto the ground: no box, border or CSS shadow. */
.cs-stage{position:relative}
.cs-hero-art{display:block;width:100%;height:auto}

/* hero entrance — one authored moment: the composition rises and fades in.
   Armed by JS only (.cs-arm); without it the image stays visible. */
.cs-hero-art{transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.cs-hero.cs-arm .cs-hero-art{opacity:0;transform:translateY(16px) scale(.99)}
.cs-hero.cs-arm.cs-in .cs-hero-art{opacity:1;transform:none;transition-delay:.05s}
.cs-hero-copy .reveal:nth-child(2){transition-delay:.07s}
.cs-hero-copy .reveal:nth-child(3){transition-delay:.14s}
.cs-hero-copy .reveal:nth-child(4){transition-delay:.21s}

@media (max-width:860px){
  .cs-hero-grid{grid-template-columns:1fr;gap:clamp(32px,7vw,48px)}
  .cs-hero-copy{max-width:none}
  .cs-stage{max-width:560px;margin-inline:auto}
}
@media (prefers-reduced-motion:reduce){
  .cs-hero.cs-arm .cs-hero-art{opacity:1;transform:none}
}

/* ===========================================================================
   BODY — gallery-light editorial system. Reusable across future case studies:
   chapter rhythm, reading measure, editorial splits, media containers and the
   intentional media placeholders. Monochrome; colour comes only from the real
   screenshots that will replace the placeholders.
   =========================================================================== */

/* chapter rhythm — generous gaps, one hairline to mark each chapter */
.chapter{padding-block:clamp(56px,9vw,120px);border-top:1px solid var(--line)}
.chapter:first-of-type{border-top:0}

/* My Role — a concise editorial standfirst continuing the hero (no metadata grid).
   Masthead layout: label column + statement, so it fills the width. */
.intro{padding-top:clamp(40px,6vw,76px)}
.intro .shell{display:grid;grid-template-columns:minmax(140px,200px) minmax(0,1fr);
  gap:clamp(28px,5vw,72px);align-items:start}
.intro .kicker{margin:0;padding-top:.4em}
.kicker{font-size:.8125rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 1.1rem}
.intro-lead{font-size:clamp(1.3rem,2vw,1.65rem);line-height:1.34;letter-spacing:-.01em;
  color:var(--ink);max-width:58ch;margin:0;text-wrap:pretty}

/* chapter heading block — px measure so the big display type wraps to ~2 lines
   (a ch-based cap here is computed on the parent's small font and wraps too tight) */
.chapter-head{max-width:620px;margin:0 0 clamp(28px,4vw,52px)}

/* reading column + body copy */
.measure{max-width:var(--read)}
.body-copy p{font-size:clamp(1.05rem,1.25vw,1.18rem);line-height:1.6;color:var(--ink-2);
  margin:0 0 1.15rem;max-width:var(--read);text-wrap:pretty}
.body-copy p:last-child{margin:0}
.body-copy strong{color:var(--ink);font-weight:600}

/* editorial split (text + media), alternating sides */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:clamp(32px,5vw,72px);align-items:center}
.split--media-lead{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
.split .body-copy p{max-width:46ch}
.split.reverse .body-copy{order:2}
.split.reverse .figure{order:1}

/* a full-width visual moment, and a contained close-up detail */
.feature{margin-top:clamp(32px,5vw,56px)}
.detail{max-width:780px;margin-top:clamp(28px,4vw,48px)}

/* media container — identical geometry to the homepage thumbnails, so real
   exports drop straight in: square corners, matte ground, cover fit */
.figure{margin:0}
.media{position:relative;background:var(--media);overflow:hidden;aspect-ratio:16/10}
.media img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{margin-top:.9rem;font-size:.9rem;line-height:1.45;color:var(--ink-3);max-width:62ch}

/* intentional placeholder — a composed wall label, never a broken dashed box */
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  gap:.55rem;padding:clamp(18px,2.4vw,30px);background:var(--media)}
.ph-tag{font-size:.8125rem;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ph-note{margin:0;font-size:clamp(.98rem,1.1vw,1.08rem);line-height:1.4;color:var(--ink-2);max-width:44ch}

/* layered composition — a dominant visual with one overlapping detail, so a
   chapter reads as a single art-directed piece instead of two stacked grey
   rectangles. The detail wears a ground-coloured mount (a matte gap, not a drop
   shadow) so it separates cleanly in the monochrome shell; a real export drops
   straight into either slot without touching the layout. */
.composition{position:relative;margin:0}
.composition>.figure{margin:0}
.composition .inset{position:absolute;z-index:2;margin:0;
  border:clamp(7px,.9vw,12px) solid var(--ground);background:var(--ground)}
/* the dominant feature + a wide detail strip tucked into its lower-right corner
   (rebuild) — the states matrix is inherently wide, so the inset runs wide too */
.composition--feature .inset{width:45%;right:-1.5%;bottom:6%}
/* within a split's media column: a smaller detail on the lower-right */
.composition--column{margin-bottom:clamp(22px,3.4vw,38px)}
.composition--column .inset{width:54%;right:-5%;bottom:-7%}
/* tighter placeholder copy for the smaller detail slot */
.ph--inset{gap:.4rem;padding:clamp(13px,1.5vw,20px)}
.ph--inset .ph-note{font-size:.88rem;max-width:26ch}
/* one caption serves the whole composition */
.composition-caption{margin-top:clamp(1.1rem,1.8vw,1.6rem)}

/* closing statement */
.statement{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,2.7vw,2.1rem);
  line-height:1.12;letter-spacing:-.02em;color:var(--ink);max-width:28ch;text-wrap:balance;
  margin:clamp(28px,4vw,48px) 0 0}

@media (max-width:820px){
  .split{grid-template-columns:1fr;gap:clamp(24px,6vw,36px)}
  .split.reverse .body-copy{order:1}
  .split.reverse .figure{order:2}
  .chapter-head{max-width:none}
  .intro .shell{grid-template-columns:1fr;gap:1.1rem}
  /* tablet: keep the layered overlap, scaled — the detail still reads at this width */
  .composition--feature .inset{width:44%;right:-2%;bottom:5%}
  .composition--column .inset{width:48%;right:-3%;bottom:-5%}
  .ph--inset .ph-note{display:none}   /* the detail speaks for itself at phone scale */
}
@media (max-width:560px){
  /* phones: a dense UI screenshot can't be appreciated as a small overlap, so the
     detail un-stacks to its own full-width plate under the primary — a clean wide
     shot + readable detail, matte frame dropped so it matches the primary */
  .composition .inset{position:relative;inset:auto;width:100%;border:0;
    background:var(--media);margin-top:clamp(10px,3vw,16px)}
}

/* ===========================================================================
   OUTCOME — before/after comparison ("The system in practice"). Gallery-light:
   a hairline-framed stage, no heavy shadow; one real CRM screen, the same
   workspace before and after. Drag / tap / arrow-keys reveal the two states.
   =========================================================================== */
.practice{margin-top:clamp(40px,6vw,76px)}
.practice-head{max-width:24ch;margin:0 0 clamp(20px,2.6vw,34px)}
.compare{position:relative;--pos:50%;aspect-ratio:2880/2202;overflow:hidden;
  border:1px solid var(--line);background:var(--media);
  touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:ew-resize}
.compare-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  display:block;pointer-events:none;-webkit-user-drag:none}
/* before sits on top, clipped to the left of the handle; after shows underneath */
.compare-img--before{clip-path:inset(0 calc(100% - var(--pos)) 0 0)}
.compare-line{position:absolute;top:0;bottom:0;left:var(--pos);width:2px;margin-left:-1px;
  background:#fff;box-shadow:0 0 0 1px rgba(20,20,20,.14);pointer-events:none}
.compare-handle{position:absolute;top:50%;left:var(--pos);width:46px;height:46px;
  transform:translate(-50%,-50%);margin:0;padding:0;border:0;border-radius:50%;
  background:#fff;color:#141414;cursor:ew-resize;display:grid;place-items:center;
  box-shadow:0 3px 12px -3px rgba(20,20,20,.4),0 0 0 1px rgba(20,20,20,.1);touch-action:none}
.compare-grip{display:block}
.compare-tag{position:absolute;top:14px;font-size:.72rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:.32rem .66rem;border-radius:99px;color:#fff;
  background:rgba(20,20,20,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  pointer-events:none}
.compare-tag--before{left:14px}
.compare-tag--after{right:14px}
.compare-handle:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* mobile-only Before/After toggle — the touch alternative to the draggable
   slider. Hidden on desktop; revealed (and the slider chrome retired) at the
   same 560px breakpoint the slider already tunes for. */
.compare-switch{display:none;width:-moz-fit-content;width:fit-content;
  margin:16px auto 0;padding:3px;gap:3px;border:1px solid var(--line);
  border-radius:99px;background:#fff;-webkit-tap-highlight-color:transparent}
.compare-switch button{appearance:none;-webkit-appearance:none;border:0;margin:0;
  cursor:pointer;font:inherit;font-size:.82rem;font-weight:600;letter-spacing:.01em;
  min-height:42px;padding:0 1.2rem;border-radius:99px;color:var(--ink-3);
  background:transparent;display:inline-flex;align-items:center;justify-content:center;
  transition:color .2s var(--ease),background .2s var(--ease)}
.compare-switch button[aria-pressed="true"]{color:#fff;background:var(--ink)}
.compare-switch button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (hover:hover) and (pointer:fine){
  .compare-switch button:not([aria-pressed="true"]):hover{color:var(--ink)}}
@media (prefers-reduced-motion:no-preference){
  .compare-line,.compare-handle,.compare-img--before{transition:left .12s var(--ease),clip-path .12s var(--ease),opacity .32s var(--ease)}
  .compare.is-dragging .compare-line,.compare.is-dragging .compare-handle,
  .compare.is-dragging .compare-img--before{transition:none}
}
@media (max-width:560px){
  /* retire the slider affordances; the stage becomes a one-up viewer driven by
     the toggle. Before is now cross-faded on opacity rather than clipped. */
  .compare{cursor:default;touch-action:pan-y}
  .compare-line,.compare-handle,.compare-tag{display:none}
  .compare-img--before{clip-path:none;opacity:0}
  .compare.show-before .compare-img--before{opacity:1}
  .compare-switch{display:flex}
}
/* enlarge affordance: a quiet pill in the stage corner that opens the full
   screenshot in a lightbox — sits above the slider, so tapping it never drags */
.compare-zoom{position:absolute;right:14px;bottom:14px;display:inline-flex;align-items:center;
  gap:.4rem;padding:.4rem .7rem;margin:0;border:0;border-radius:99px;cursor:zoom-in;
  font:inherit;font-size:.72rem;font-weight:600;letter-spacing:.04em;color:#fff;
  background:rgba(20,20,20,.72);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  touch-action:manipulation;z-index:2}
.compare-zoom svg{display:block}
.compare-zoom:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.compare-zoom:hover{background:rgba(20,20,20,.88)}}
@media (max-width:560px){.compare-zoom{right:10px;bottom:10px;font-size:.7rem;padding:.36rem .6rem}}

/* lightbox: full-size enlarged view of either screenshot, with a Before/After
   toggle so a reader can inspect each at native detail (esp. on mobile) */
.lightbox[hidden]{display:none}
.lightbox{position:fixed;inset:0;z-index:200;display:grid;grid-template-rows:auto 1fr;
  gap:clamp(12px,2.4vw,22px);padding:clamp(14px,3vw,30px);
  background:rgba(14,14,14,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lightbox-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.lightbox-toggle{display:inline-flex;padding:3px;border-radius:99px;background:rgba(255,255,255,.12)}
.lightbox-toggle button{appearance:none;border:0;margin:0;cursor:pointer;font:inherit;
  font-size:.82rem;font-weight:600;letter-spacing:.02em;padding:.44rem 1.1rem;border-radius:99px;
  color:rgba(255,255,255,.72);background:transparent;transition:color .2s var(--ease),background .2s var(--ease)}
.lightbox-toggle button[aria-pressed="true"]{color:#141414;background:#fff}
.lightbox-close{appearance:none;border:0;margin:0;width:42px;height:42px;flex:none;cursor:pointer;
  border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);
  transition:background .2s var(--ease)}
.lightbox-close:focus-visible,.lightbox-toggle button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (hover:hover) and (pointer:fine){.lightbox-close:hover{background:rgba(255,255,255,.26)}}
.lightbox-stage{min-height:0;display:grid;place-items:center}
.lightbox-img{width:auto;height:auto;max-width:100%;max-height:100%;display:block;
  border:1px solid rgba(255,255,255,.16)}
@media (prefers-reduced-motion:no-preference){
  .lightbox{animation:lb-fade .22s var(--ease)}
  @keyframes lb-fade{from{opacity:0}to{opacity:1}}
}

/* footer — ported from the homepage contact section (literal values) */
.contact{margin-top:clamp(64px,10vw,128px);border-top:1px solid rgba(20,20,20,.10);
  padding-top:clamp(74px,12vw,164px);padding-bottom:clamp(36px,4vw,56px)}
.contact h2{font-family:'Bricolage Grotesque',Georgia,serif;font-weight:600;
  font-size:clamp(2.4rem,7vw,5.5rem);line-height:.95;letter-spacing:-.03em;
  margin:0;text-wrap:balance;color:#141414}
.contact h2 a{position:relative;display:inline-block;text-decoration:none;color:inherit;
  transition:color .3s cubic-bezier(.22,.9,.26,1)}
.contact h2 a::after{content:"";position:absolute;left:0;bottom:.06em;width:100%;
  height:3px;background:currentColor;transform:scaleX(0);transform-origin:left;
  transition:transform .55s cubic-bezier(.22,1,.36,1)}
.contact-lead{margin:clamp(22px,3vw,38px) 0 0;font-size:clamp(1.1rem,1.6vw,1.3rem);
  color:#4f5258;max-width:42ch;line-height:1.45;text-wrap:pretty}
.contact-links{margin-top:clamp(34px,5vw,56px);display:flex;flex-wrap:wrap;gap:.8rem}
.contact-links a{display:inline-flex;align-items:center;gap:.5rem;padding:.85rem 1.5rem;
  font-weight:500;border-radius:99px;color:#141414;background:#ebedee;text-decoration:none;
  transition:background .3s cubic-bezier(.22,.9,.26,1),color .3s cubic-bezier(.22,.9,.26,1),
             transform .16s cubic-bezier(.22,1,.36,1)}
.contact-links a.primary{background:#141414;color:#f6f7f7}
.contact-links a:active{transform:scale(.97)}
.colophon{margin-top:clamp(64px,10vw,128px);display:flex;justify-content:space-between;
  flex-wrap:wrap;gap:.6rem 1.5rem;color:#646770;font-size:.9rem}
.colophon b{color:#141414;font-weight:500}
@media (hover:hover) and (pointer:fine){
  .nav-links a.cta:hover::after{transform:scaleX(1)}
  .contact h2 a:hover{color:#141414}
  .contact h2 a:hover::after{transform:scaleX(1)}
  .contact-links a:hover{transform:translateY(-2px);background:#e3e5e7}
  .contact-links a.primary:hover{background:#000}
}

/* ---------------------------------------------------------------------------
   Process timeline — the opening figure of ch.04 "Keeping the work consistent".
   Full-width horizontal timeline on desktop; a vertical timeline below 1120px
   (where the horizontal labels would fall under the legible floor). Monochrome,
   reuses the chapter's figure + .reveal rhythm. The SVG labels are inline
   (bound to the diagram geometry); the caption is content-driven like the rest.
   --------------------------------------------------------------------------- */
.process{margin:0 0 clamp(44px,6vw,76px)}
.process .svg-wrap svg{width:100%;height:auto;display:block;overflow:visible}
.s-coord{font-family:var(--body);font-weight:400;font-size:13.5px;fill:var(--ink-3)}
.s-coord .em{font-weight:500;fill:var(--ink-2)}
.s-phase{font-family:var(--display);font-weight:600;font-size:22.5px;letter-spacing:-.4px;fill:var(--ink)}
.s-meta{font-family:var(--body);font-weight:400;font-size:13.5px;fill:var(--ink-3)}
.s-loop{font-family:var(--body);font-weight:400;font-size:13.5px;fill:var(--ink-3)}
.d-desk{display:block}
/* left-aligned to the chapter's editorial column (its heading and body hang left too) */
.d-mob{display:none;max-width:540px}
@media (max-width:1120px){ .d-desk{display:none} .d-mob{display:block} }
.coord{margin:0 0 clamp(34px,8vw,46px)}
.coord .ch{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:-.02em;margin:0 0 .4rem;color:var(--ink);line-height:1.1}
.coord p{margin:0;font-size:.95rem;line-height:1.45;color:var(--ink-3)}
.vtl{list-style:none;margin:0;padding:0 0 0 34px;position:relative}
.vtl::before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:1.5px;background:var(--line-2)}
.vstep{position:relative;padding:0 0 clamp(28px,7vw,38px)}
.vstep:last-child{padding-bottom:0}
.vdot{position:absolute;left:-34px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 5px var(--ground)}
.vstep .vt{font-family:var(--display);font-weight:600;font-size:1.5rem;letter-spacing:-.02em;line-height:1.05;margin:0 0 .3rem;color:var(--ink)}
.vstep p{margin:0;font-size:.95rem;line-height:1.4;color:var(--ink-3)}
/* the feedback loop continues the spine: it drops from the last dot, turns, and
   points back up toward the earlier phases */
.vloop{position:relative;margin:0;padding:0 0 0 42px;min-height:92px;display:flex;align-items:flex-start}
.vloop svg{position:absolute;left:-0.5px;top:-16px;height:108px;width:36px}
.vloop p{margin:0;padding-top:clamp(10px,4vw,18px);font-size:.95rem;line-height:1.45;color:var(--ink-2);max-width:40ch}
.vloop p b{color:var(--ink);font-weight:600}
.draw{stroke-dasharray:1}
.process.in .draw{animation:draw 1.1s .2s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){ .process.in .draw{animation:none} }

/* reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

@media (max-width:760px){
  body{font-size:16px}
  .intro-lead{max-width:none}
  .statement{max-width:none}
}
</style>

<script>
const io=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* scroll-aware nav: solid at the top, blur + hairline once you scroll (matches homepage) */
const nav=document.querySelector('.nav');
if(nav){const sync=()=>nav.classList.toggle('scrolled',window.scrollY>8);
  window.addEventListener('scroll',sync,{passive:true});sync();}

/* hero composition: arm the staggered entrance (one authored moment). The hidden
   state only applies while .cs-arm is set, so the composition stays visible if
   this never runs or when reduced-motion is preferred. */
(function(){const hero=document.querySelector('.cs-hero');
  if(!hero||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  hero.classList.add('cs-arm');
  requestAnimationFrame(()=>requestAnimationFrame(()=>hero.classList.add('cs-in')));})();

/* before/after comparison: drag (mouse + touch via pointer events), click-to-jump,
   and arrow-key control on the handle. No transition while dragging; the CSS keeps
   keyboard steps smooth and honours prefers-reduced-motion. */
(function(){
  const c=document.querySelector('.compare'); if(!c)return;
  const handle=c.querySelector('.compare-handle');
  const set=(p)=>{p=Math.max(0,Math.min(100,p));
    c.style.setProperty('--pos',p+'%');
    const r=Math.round(p);
    handle.setAttribute('aria-valuenow',r);
    handle.setAttribute('aria-valuetext',r+'% before, '+(100-r)+'% after');};
  const posFrom=(e)=>{const b=c.getBoundingClientRect();
    return (e.clientX-b.left)/b.width*100;};
  let dragging=false;
  /* the Enlarge button lives inside the stage — don't let a tap on it start a drag */
  const zoom=c.querySelector('.compare-zoom');
  if(zoom)zoom.addEventListener('pointerdown',(e)=>e.stopPropagation());
  /* below 560px the slider is replaced by the Before/After toggle — don't drag */
  const touchMq=window.matchMedia('(max-width:560px)');
  c.addEventListener('pointerdown',(e)=>{if(touchMq.matches)return;dragging=true;c.classList.add('is-dragging');
    set(posFrom(e));try{c.setPointerCapture(e.pointerId)}catch(_){ } e.preventDefault();});
  c.addEventListener('pointermove',(e)=>{if(dragging){set(posFrom(e));e.preventDefault();}});
  const end=(e)=>{if(!dragging)return;dragging=false;c.classList.remove('is-dragging');
    try{c.releasePointerCapture(e.pointerId)}catch(_){ }};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  handle.addEventListener('keydown',(e)=>{
    const cur=parseFloat(c.style.getPropertyValue('--pos'))||50;let p;
    switch(e.key){
      case 'ArrowLeft':case 'ArrowDown':p=cur-2;break;
      case 'ArrowRight':case 'ArrowUp':p=cur+2;break;
      case 'Home':p=0;break;case 'End':p=100;break;
      case 'PageDown':p=cur-10;break;case 'PageUp':p=cur+10;break;
      default:return;}
    e.preventDefault();set(p);});
  set(50);
})();

/* Mobile Before/After toggle: swaps which screenshot is shown (After by default).
   The CSS cross-fades the before image on opacity; desktop never shows this. */
(function(){
  const sw=document.querySelector('.compare-switch'); if(!sw)return;
  const c=document.querySelector('.compare'); if(!c)return;
  const btns=[...sw.querySelectorAll('button')];
  const show=(side)=>{
    c.classList.toggle('show-before',side==='before');
    btns.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.side===side)));};
  btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.side)));
  show('after');
})();

/* Outcome lightbox: "Enlarge" opens the full screenshot; a Before/After toggle
   swaps the source. Esc or a scrim click closes; focus returns to the trigger. */
(function(){
  const lb=document.getElementById('compare-lightbox');
  const open=document.querySelector('.compare-zoom');
  if(!lb||!open)return;
  const img=lb.querySelector('.lightbox-img');
  const closeBtn=lb.querySelector('.lightbox-close');
  const toggles=[...lb.querySelectorAll('.lightbox-toggle button')];
  const compare=document.querySelector('.compare');
  const src={
    before:'assets/design system images/outcome/crm-before.webp',
    after:'assets/design system images/outcome/crm-after.webp'};
  const label={
    before:'The CRM contact workspace before the redesign, at full size.',
    after:'The redesigned CRM contact workspace at full size.'};
  const show=(side)=>{img.src=src[side];img.alt=label[side];
    toggles.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lb===side)));};
  const openLb=()=>{
    /* default to the side on show: the mobile toggle if active, else whichever
       side the desktop slider is currently favouring */
    const pos=parseFloat(compare&&compare.style.getPropertyValue('--pos'))||50;
    const side=compare&&compare.classList.contains('show-before')?'before':(pos<50?'before':'after');
    show(side);
    lb.hidden=false;document.body.style.overflow='hidden';closeBtn.focus();};
  const closeLb=()=>{lb.hidden=true;document.body.style.overflow='';open.focus();};
  open.addEventListener('click',openLb);
  closeBtn.addEventListener('click',closeLb);
  toggles.forEach(b=>b.addEventListener('click',()=>show(b.dataset.lb)));
  lb.addEventListener('click',(e)=>{if(e.target===lb)closeLb();});
  document.addEventListener('keydown',(e)=>{if(!lb.hidden&&e.key==='Escape')closeLb();});
})();
</script>
