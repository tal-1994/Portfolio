<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tal Yanay, Product Designer</title>
<meta name="description" content="Tal Yanay, a product designer who builds. Selected work in complex SaaS, design systems and data products.">
<meta name="theme-color" content="#f6f7f7">
<link rel="icon" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     GALLERY (light) — refined. A bright white-cube room. The walls are
     quiet; Tal's real products are the only colour, hung like works with
     their own wall labels. Shell is monochrome (near-black ink on cool
     soft white). Motion is subtle: the work is unveiled, not announced.
     ===================================================================== */
  :root{
    --ground:   #f6f7f7;   /* cool soft white, low chroma */
    --ground-2: #ebedee;   /* one tone step down, for bands */
    --ink:      #141414;   /* brand near-black */
    --ink-2:    #4f5258;   /* secondary, AA */
    --ink-3:    #646770;   /* small meta, AA */
    --media:    #e7e9ec;   /* image matte */
    --line:     rgba(20,20,20,.10);   /* hairline */
    --live:     #1d8f4e;   /* the one small "available" dot in About */

    --display: "Bricolage Grotesque", Georgia, serif;
    --body:    "Inter", system-ui, sans-serif;

    --maxw: 1280px;
    --gutter: clamp(22px, 5vw, 80px);
    --navh: 66px;          /* sticky nav height, so sticky columns sit below it */

    /* motion — stronger than the CSS defaults, with intent */
    --ease:        cubic-bezier(.22,.9,.26,1);
    --ease-out:    cubic-bezier(.22,1,.36,1);
    --ease-in-out: cubic-bezier(.76,0,.24,1);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; color-scheme:light; }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--body);
    font-size:17px;
    line-height:1.6;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overflow-x:hidden;
    touch-action:manipulation;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; -webkit-tap-highlight-color:transparent; }

  ::selection{ background:var(--ink); color:var(--ground); }
  ::-webkit-scrollbar{ width:11px; height:11px; }
  ::-webkit-scrollbar-track{ background:var(--ground); }
  ::-webkit-scrollbar-thumb{ background:#cfd2d4; border:3px solid var(--ground); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover{ background:#b7babd; }

  :focus-visible{ outline:2px solid var(--ink); outline-offset:3px; border-radius:2px; }

  /* anchored sections clear the sticky nav */
  #top,#work,#about,#contact{ scroll-margin-top:clamp(76px,11vw,104px); }

  .shell{ width:100%; max-width:var(--maxw); margin:0 auto; padding-inline:var(--gutter); }

  .skip{ position:absolute; left:-9999px; top:0; background:var(--ink); color:var(--ground); padding:.7rem 1.1rem; z-index:200; font-weight:600; border-radius:0 0 4px 0; }
  .skip:focus{ left:0; }

  /* ---------- nav ---------- */
  .nav{
    position:sticky; top:0; z-index:100;
    background:var(--ground);
    border-bottom:1px solid transparent;
    transition:background .45s var(--ease), border-color .45s var(--ease), backdrop-filter .45s var(--ease);
  }
  .nav.scrolled{
    background:color-mix(in srgb, var(--ground) 72%, transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);
    backdrop-filter:saturate(1.4) blur(14px);
    border-bottom-color:var(--line);
  }
  .nav-in{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem; padding-block:clamp(16px,2vw,22px); }
  .wordmark{ font-family:var(--display); font-weight:600; font-size:1.06rem; letter-spacing:-.01em; }
  .wordmark span{ color:var(--ink-3); font-family:var(--body); font-weight:400; font-size:.86rem; margin-left:.55rem; }
  .nav-links{ display:flex; align-items:baseline; gap:clamp(1.1rem,2.6vw,2.2rem); }
  .nav-links a{ color:var(--ink-2); font-size:.95rem; transition:color .25s var(--ease); }
  .nav-links a:hover{ color:var(--ink); }
  .nav-links a.cta{ color:var(--ink); font-weight:500; position:relative; }
  .nav-links a.cta::after{ content:""; position:absolute; left:0; right:0; bottom:-3px; height:1.5px; background:var(--ink); transform:scaleX(0); transform-origin:left; transition:transform .35s var(--ease-out); }
  @media (max-width:560px){ .wordmark span{ display:none; } .nav-links a.hidephone{ display:none; } }

  /* ---------- hero ---------- */
  .hero{ position:relative; min-height:100svh; display:flex; flex-direction:column; justify-content:flex-end; padding-top:clamp(80px,12vw,140px); padding-bottom:clamp(72px,10vw,120px); }
  /* hero copy sits above the dot-field. Readability behind the text is handled at
     the source: the dot-field canvas suppresses its cursor-darkening over the hero
     copy (per-line text mask), so the grid stays faint and un-crowded right up to
     the letters without any plate or halo. See the dot-field script's computeMask. */
  .hero > .hero-copy{ position:relative; z-index:2; }
  .hero h1{
    font-family:var(--display);
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(1.2rem,6.1vw,5.7rem);
    line-height:.96;
    letter-spacing:-.035em;
    margin:0;
    text-wrap:balance;
  }
  .greet{ display:flex; align-items:center; gap:clamp(14px,1.4vw,20px); margin-bottom:clamp(26px,4vw,52px); }
  .greet-photo{ width:clamp(64px,6vw,88px); aspect-ratio:1/1.1; height:auto; object-fit:cover; object-position:top center; border-radius:14px; border:1px solid var(--line); filter:grayscale(1); background:var(--media); transform:rotate(-7deg); box-shadow:0 12px 26px rgba(20,20,20,.16); }
  .greet-text{ margin:0; font-size:clamp(1.15rem,1.7vw,1.5rem); line-height:1.18; color:var(--ink); }
  /* "See the work" — the clickable cue that anchors the bottom of the intro
     and signals the case studies are a scroll/click away */
  .hero-act{ display:inline-flex; align-items:center; gap:.7rem; font-weight:500; font-size:1.02rem; color:var(--ink); transition:transform .14s var(--ease-out); }
  .hero-act .bar{ width:42px; height:1.5px; background:var(--ink); transition:width .4s var(--ease-out); }
  .hero .hero-act{ margin-top:clamp(32px,5vw,64px); align-self:flex-start; }

  /* ---------- dot-field ---------- */
  /* Full-bleed canvas pinned to the hero. Breaks out of the .shell max-width
     so dots span the viewport, but its height is bounded to the hero only. */
  .dotfield{
    position:absolute; top:0; bottom:0;
    left:50%; width:100vw; margin-left:-50vw;
    z-index:0; pointer-events:none;
  }

  /* ---------- custom circle cursor ---------- */
  /* A hairline ring that trails the pointer across the whole homepage, so the
     "circle" reads as the cursor everywhere — not just over the dots. The
     native cursor stays as a companion: a plain arrow, or a hand over
     clickable elements (see the cursor normalization below). */
  .cursor-ring{
    position:fixed; left:0; top:0;
    width:36px; height:36px; margin:-18px 0 0 -18px;
    border:1px solid rgba(20,20,20,.32);
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    opacity:0;
    transform:translate3d(-100px,-100px,0);
    transition:opacity .3s var(--ease-out),
               width .28s var(--ease-out), height .28s var(--ease-out),
               margin .28s var(--ease-out), border-color .28s var(--ease-out);
    will-change:transform;
  }
  .cursor-ring.is-visible{ opacity:1; }
  /* grows over clickable things, pairing with the hand cursor below */
  .cursor-ring.is-hover{
    width:56px; height:56px; margin:-28px 0 0 -28px;
    border-color:rgba(20,20,20,.5);
  }
  /* normalize the native cursor: a plain arrow by default (no I-beam flicker over
     text), but a hand/pointer on clickable things so they read as clickable.
     The `… *` on each clickable also covers its children (e.g. the image and
     text inside a case-study card), so the whole card shows the hand — not just
     its bare edges. Only applied once JS confirms a fine pointer + motion. */
  html.cursor-custom, html.cursor-custom *{ cursor:default; }
  html.cursor-custom a, html.cursor-custom a *,
  html.cursor-custom button, html.cursor-custom button *,
  html.cursor-custom [role=button], html.cursor-custom [role=button] *,
  html.cursor-custom label, html.cursor-custom label *,
  html.cursor-custom summary, html.cursor-custom summary *{ cursor:pointer; }

  /* ---------- work : quiet gallery ----------
     Heading, note and a sticky project index on the left (3 of 12 columns);
     large covers with one caption each on the right. The index marks the
     project in view (script below). From 1000px down the projects stack. */
  .pe{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); column-gap:clamp(16px,2vw,28px); align-items:start; padding-top:clamp(44px,5.6vw,80px); padding-bottom:clamp(96px,10vw,152px); }
  .pe-side{ grid-column:1/4; align-self:stretch; }
  .pe-stick{ position:sticky; top:calc(var(--navh) + 36px); display:grid; gap:12px; padding-right:12px; }
  .pe-h{ font-family:var(--display); font-optical-sizing:auto; font-weight:600; font-size:clamp(1.5rem,2.3vw,2.05rem); line-height:1.08; letter-spacing:-.022em; margin:0; text-wrap:balance; }
  .pe-n{ color:var(--ink-3); font-size:.95rem; line-height:1.5; max-width:24ch; margin:0; }

  .pe-idx{ margin:30px 0 0; padding:0; list-style:none; display:grid; }
  .pe-idx a{ display:grid; grid-template-columns:2.3em 1fr; padding:6px 0; font-size:.95rem; line-height:1.35; color:var(--ink-3); transition:color .35s var(--ease); }
  .pe-no{ font-variant-numeric:tabular-nums; opacity:.55; transition:opacity .35s var(--ease); }
  .pe-l{ justify-self:start; }
  .pe-idx a:hover{ color:var(--ink-2); }
  .pe-idx a.on{ color:var(--ink); }
  .pe-idx a.on .pe-no{ opacity:1; }

  .pe-list{ grid-column:4/13; display:grid; gap:clamp(96px,10vw,152px); }
  .pe-p{ display:grid; gap:clamp(22px,2.2vw,30px); scroll-margin-top:calc(var(--navh) + 36px); transition:transform .14s var(--ease-out); }
  .pe-img{ position:relative; overflow:hidden; aspect-ratio:16/10; background:var(--field,var(--media)); }
  .pe-img > img{ width:100%; height:100%; object-fit:cover; scale:1.015; transition:scale 1s var(--ease-out), clip-path .95s var(--ease-out), opacity .6s var(--ease-out); }
  /* Design-system cover (#01): the transparent hero artwork composed on its
     soft lavender field; it crops a little at the bottom edge, on purpose. */
  .pe-img--ds > img{ position:absolute; left:50%; top:9.5%; width:84%; height:auto; object-fit:contain; translate:-50% 0; }

  .pe-cap{ display:grid; justify-items:start; max-width:min(100%,34rem); }
  .pe-t{ font-family:var(--display); font-optical-sizing:auto; font-weight:600; font-size:clamp(1.45rem,2.05vw,1.85rem); line-height:1.1; letter-spacing:-.022em; margin:0; text-wrap:balance; }
  .pe-s{ margin:12px 0 0; font-size:1.02rem; line-height:1.55; color:var(--ink-2); text-wrap:pretty; }
  .pe-m{ margin:10px 0 0; font-size:.86rem; line-height:1.45; color:var(--ink-3); }
  .pe-go{ position:relative; margin-top:22px; display:inline-flex; align-items:center; gap:.5rem; font-size:.95rem; font-weight:500; }
  .pe-go::after{ content:""; position:absolute; left:0; right:0; bottom:-4px; height:1.5px; background:currentColor; transform:scaleX(0); transform-origin:left; transition:transform .4s var(--ease-out); }
  .pe-go .ar{ width:.82em; height:.82em; flex:none; transition:transform .4s var(--ease-out); }

  @media (max-width:1000px){
    .pe-side{ grid-column:1/13; }
    .pe-stick{ position:static; margin-bottom:clamp(30px,4.5vw,44px); }
    .pe-n{ max-width:46ch; }
    .pe-idx{ display:none; }
    .pe-list{ grid-column:1/13; }
  }
  @media (max-width:640px){
    .pe-list{ gap:72px; }
    .pe-p{ gap:20px; }
    .pe-go{ margin-top:18px; }
  }

  /* ---------- about : side facts (strip) ----------
     Portrait on the left, words on the right, the four facts in a ruled row
     beneath. Sits on a soft #f2f2f2 band. */
  .a3-wrap{
    --a3-bg:#f2f2f2;
    --a3-txt:color-mix(in srgb, var(--ink) 85%, var(--a3-bg));
    --a3-ink3:color-mix(in srgb, var(--ink) 62%, var(--a3-bg));
    --a3-line:color-mix(in srgb, var(--ink) 13%, var(--a3-bg));
    background:var(--a3-bg);
  }
  .a3{ padding-block:clamp(88px,11vw,168px); }
  .a3-g{ display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); column-gap:clamp(16px,2vw,28px); align-items:start; }
  /* the portrait column starts at the label's cap height, so tops line up */
  .a3-side{ grid-column:1/6; grid-row:1; padding-top:calc(clamp(1.5rem,2.3vw,2.05rem) * .17); }
  .a3-main{ grid-column:7/13; grid-row:1; }
  .a3-ph{ aspect-ratio:4/5; margin:0; overflow:hidden; background:var(--media); }
  .a3-ph img{ width:100%; height:100%; object-fit:cover; object-position:50% 0; transition:clip-path .95s var(--ease-out), opacity .25s var(--ease-out); }
  .a3-k{ font-family:var(--display); font-optical-sizing:auto; font-weight:600; font-size:clamp(1.5rem,2.3vw,2.05rem); line-height:1.08; letter-spacing:-.022em; margin:0 0 clamp(36px,4vw,60px); }
  .a3-lead{ font-size:clamp(1.2rem,1.75vw,1.42rem); line-height:1.45; margin:0 0 1.8rem; max-width:34rem; text-wrap:pretty; }
  .a3-p{ color:var(--a3-txt); font-size:1.0625rem; line-height:1.68; max-width:34rem; margin:0 0 1em; text-wrap:pretty; }
  .a3-st{ display:flex; align-items:center; gap:.7rem; font-weight:500; margin:1.8rem 0 0; }
  .dot-live{ width:8px; height:8px; border-radius:50%; background:var(--live); flex:none; align-self:flex-start; margin-top:.55em; }
  .a3-dl{ grid-column:1/13; grid-row:2; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1.2rem clamp(16px,2vw,28px); margin:clamp(64px,7vw,112px) 0 0; padding-top:clamp(20px,2vw,28px); border-top:1px solid var(--a3-line); }
  .a3-dl div{ display:grid; gap:.2rem; align-content:start; }
  .a3-dl dt{ font-size:.85rem; line-height:1.3; color:var(--a3-ink3); }
  .a3-dl dd{ margin:0; font-size:1rem; line-height:1.42; max-width:24ch; text-wrap:balance; }
  /* phones: one column, in reading order (label, portrait, lead, facts, story) */
  @media (max-width:700px){
    .a3-g{ display:flex; flex-direction:column; }
    .a3-main, .a3-side{ display:contents; }
    .a3-k{ order:-1; }
    .a3-ph{ order:0; width:min(84%,340px); margin-bottom:clamp(32px,8vw,44px); }
    .a3-lead{ order:2; }
    .a3-dl{ order:3; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 20px; margin:0 0 clamp(34px,9vw,44px); padding:0; border:0; }
    .a3-p{ order:4; }
    .a3-st{ order:5; }
  }

  /* ---------- contact / footer ---------- */
  .contact{ padding-top:clamp(74px,12vw,164px); padding-bottom:clamp(36px,4vw,56px); }
  .contact h2{ font-family:var(--display); font-weight:600; font-size:clamp(2.4rem,6.5vw,6rem); line-height:.95; letter-spacing:-.03em; margin:0; text-wrap:balance; }
  .contact h2 a{ position:relative; display:inline-block; transition:color .3s var(--ease); }
  .contact h2 a::after{ content:""; position:absolute; left:0; bottom:.06em; width:100%; height:3px; background:currentColor; transform:scaleX(0); transform-origin:left; transition:transform .55s var(--ease-out); }
  .contact-lead{ margin:clamp(22px,3vw,38px) 0 0; font-size:clamp(1.1rem,1.6vw,1.3rem); color:var(--ink-2); max-width:42ch; line-height:1.45; text-wrap:pretty; }
  .contact-links{ margin-top:clamp(34px,5vw,56px); display:flex; flex-wrap:wrap; gap:.8rem; }
  .contact-links a{ display:inline-flex; align-items:center; gap:.5rem; padding:.85rem 1.5rem; font-weight:500; border-radius:99px; color:var(--ink); background:var(--ground-2); transition:background .3s var(--ease), color .3s var(--ease), transform .16s var(--ease-out); }
  .contact-links a.primary{ background:var(--ink); color:var(--ground); }
  .contact-links a:active{ transform:scale(.97); }
  /* the address written out, for people without a mail app; one click selects it */
  .contact-addr{ margin:1rem 0 0; color:var(--ink-3); user-select:all; }

  .colophon{ margin-top:clamp(64px,10vw,128px); display:flex; justify-content:space-between; flex-wrap:wrap; gap:.6rem 1.5rem; color:var(--ink-3); font-size:.9rem; }
  .colophon b{ color:var(--ink); font-weight:500; }

  /* ---------- reveal ---------- */
  .rise{ opacity:0; transform:translateY(22px); transition:opacity .72s var(--ease-out), transform .72s var(--ease-out); }
  .rise.in{ opacity:1; transform:none; }
  /* media unveils like a work being hung. Clip the IMAGE, never the element
     the IntersectionObserver watches — a fully clipped target stops firing. */
  .rise-clip img{ clip-path:inset(0 0 100% 0); }
  .rise-clip.in img{ clip-path:inset(0 0 0 0); }
  /* portrait fades up over the neutral matte once decoded; JS only hides it
     while it's genuinely still loading, so cached hits show with no flash. */
  .a3-ph img.img-loading{ opacity:0; }

  /* progressive enhancement: everything is visible unless JS arms the reveal,
     so a script failure or no-JS can never leave the page hidden. */
  html:not(.reveal-ready) .rise{ opacity:1; transform:none; }
  html:not(.reveal-ready) .rise-clip img{ clip-path:none; }

  /* ---------- hover & press (pointer devices only) ---------- */
  @media (hover:hover) and (pointer:fine){
    /* the greet photo rests as a faded black-and-white portrait; hovering it
       reveals the image in full colour and scales it up a touch */
    .greet-photo{
      opacity:.7;
      transition:filter .55s var(--ease-out), transform .55s var(--ease-out),
                 opacity .55s var(--ease-out), box-shadow .55s var(--ease-out);
    }
    .greet-photo:hover{
      opacity:1;
      filter:grayscale(0);
      transform:rotate(-3deg) scale(1.1);
      box-shadow:0 22px 46px rgba(20,20,20,.26);
    }

    .nav-links a.cta:hover::after{ transform:scaleX(1); }
    .hero-act:hover .bar{ width:66px; }
    .pe-p:hover .pe-img > img{ scale:1.04; }
    .pe-p:hover .pe-go::after{ transform:scaleX(1); }
    .pe-p:hover .pe-go .ar{ transform:translate(3px,-3px); }
    .contact h2 a:hover{ color:var(--ink); }
    .contact h2 a:hover::after{ transform:scaleX(1); }
    .contact-links a:hover{ transform:translateY(-2px); background:#e3e5e7; }
    .contact-links a.primary:hover{ background:#000; }
  }
  /* keyboard focus mirrors the hover reveal so it is never pointer-only */
  .pe-p:focus-visible .pe-img > img{ scale:1.04; }
  .pe-p:focus-visible .pe-go::after{ transform:scaleX(1); }
  .pe-p:focus-visible .pe-go .ar{ transform:translate(3px,-3px); }

  /* press feedback */
  .hero-act:active{ transform:scale(.98); }
  .pe-p:active{ transform:scale(.995); }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none!important; transition:none!important; }
    .rise{ opacity:1; transform:none; }
    .rise-clip img{ clip-path:none; }
    .pe-img > img{ scale:1; }
    /* dot-field renders static; greet photo stays at its full, unfaded state */
    .cursor-ring{ display:none; }
  }
</style>
</head>
<body>
<a class="skip" href="#work">Skip to selected work</a>

<header class="nav">
  <div class="shell nav-in">
    <a class="wordmark" href="#top" data-c="shared.nav.wordmark"></a>
    <nav class="nav-links" aria-label="Primary">
      <a class="hidephone" href="#work" data-c="shared.nav.work"></a>
      <a class="hidephone" href="#about" data-c="shared.nav.about"></a>
      <a class="cta" href="mailto:talyanay10@gmail.com" data-c="shared.nav.getInTouch;@href:shared.contact.email"></a>
    </nav>
  </div>
</header>

<main id="top">

  <!-- HERO -->
  <section class="hero shell" aria-labelledby="hero-h">
    <canvas class="dotfield" aria-hidden="true"></canvas>
    <div class="hero-copy">
      <div class="greet rise">
        <img class="greet-photo" src="assets/portrait/greet-color.png" width="88" height="97"
             data-c="@alt:home.hero.portraitAlt" decoding="async">
        <p class="greet-text" data-c="home.hero.greeting"></p>
      </div>
      <h1 id="hero-h" class="rise" data-c="home.hero.headline"></h1>

      <a class="hero-act rise" href="#work" data-c="home.hero.seeWork"></a>
    </div>
  </section>

  <!-- WORK : heading, note and sticky project index left; covers right -->
  <section class="pe shell" id="work" aria-labelledby="work-h">
    <div class="pe-side">
      <div class="pe-stick">
        <h2 class="pe-h rise" id="work-h" data-c="home.work.heading"></h2>
        <p class="pe-n rise" data-c="home.work.note"></p>

<script>
(function(){
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* scroll-aware nav: hairline + backdrop blur once you leave the top */
  var nav = document.querySelector(".nav");
  if (nav){
    var ticking = false;
    var sync = function(){ nav.classList.toggle("scrolled", window.scrollY > 8); ticking = false; };
    window.addEventListener("scroll", function(){
      if (!ticking){ window.requestAnimationFrame(sync); ticking = true; }
    }, { passive:true });
    sync();
  }

  /* About portrait: fade in once the image has decoded. Images that are
     already complete (cache) are left untouched so they paint instantly —
     only a still-loading image is hidden, then revealed on load/error. */
  var portrait = document.querySelector(".a3-ph img");
  if (portrait && !(portrait.complete && portrait.naturalWidth > 0)){
    portrait.classList.add("img-loading");
    var showPortrait = function(){ portrait.classList.remove("img-loading"); };
    portrait.addEventListener("load", showPortrait, { once:true });
    portrait.addEventListener("error", showPortrait, { once:true });
  }

  /* work index: mark the project crossing the middle band of the screen.
     Runs with reduced motion too (it is a state change, not an animation). */
  var idxLinks = [].slice.call(document.querySelectorAll(".pe-idx a"));
  var projects = [].slice.call(document.querySelectorAll(".pe-p"));
  if (idxLinks.length && projects.length && "IntersectionObserver" in window){
    var mark = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var i = projects.indexOf(e.target);
        idxLinks.forEach(function(a, j){
          a.classList.toggle("on", j === i);
          if (j === i) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
        });
      });
    }, { rootMargin:"-42% 0px -52% 0px" });
    projects.forEach(function(p){ mark.observe(p); });
  }

  /* staggered reveal + clip unveil. Content is visible by default (see CSS);
     we only arm the hidden states once we know we can animate them back in. */
  if (reduce || !("IntersectionObserver" in window)) return;

  try {
    var root = document.documentElement;
    var items = document.querySelectorAll(".rise, .rise-clip");
    document.querySelectorAll(".hero, .pe-stick, .pe-cap, .a3-main, .a3-dl").forEach(function(group){
      group.querySelectorAll(".rise").forEach(function(el,i){ el.style.transitionDelay = (i*60)+"ms"; });
    });
    root.classList.add("reveal-ready");   // now the hidden states apply
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold:.12, rootMargin:"0px 0px -8% 0px" });
    items.forEach(function(el){ io.observe(el); });

    /* The hero is above the fold, and its "See the work" CTA sits pinned to the
       bottom of the viewport — right in the observer's -8% bottom dead-zone, so
       it would never reveal (and there's no scroll to trigger it). Reveal the
       hero on load instead; two frames in so the fade still plays. */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      document.querySelectorAll(".hero .rise").forEach(function(el){ el.classList.add("in"); });
    }); });
  } catch (err){
    document.documentElement.classList.remove("reveal-ready");  // fail visible
  }
})();
</script>

<!-- ===================================================================
     Interactive dot-field — hero only. The dots respond to the cursor
     (darken + enlarge with a smooth radial falloff) and settle back when it
     leaves. Static on touch / reduced-motion. Self-contained.
     =================================================================== -->
<script>
(function(){
  var canvas = document.querySelector(".hero .dotfield");
  if (!canvas) return;
  var hero = canvas.parentElement;
  var ctx = canvas.getContext("2d");

  var mqReduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var mqFine   = window.matchMedia("(hover:hover) and (pointer:fine)");

  /* --- tunables --- */
  var GAP = 26;        // grid spacing (css px)
  var R_BASE = 1.0;    // dot radius at rest
  var R_MAX  = 2.6;    // dot radius at the cursor centre
  var A_BASE = 0.14;   // dot alpha at rest (low contrast)
  var A_MAX  = 0.85;   // dot alpha at the cursor centre
  var INFLUENCE = 120; // px radius the cursor reaches
  var LERP = 0.18;     // pointer smoothing per frame
  var MASK_PAD = 6;    // px the text mask extends past each line box
  var MASK_FEATHER = 30; // px over which the darkening fades back in past the text

  var dpr = 1, W = 0, H = 0, cols = 0, rows = 0, offX = 0, offY = 0;

  function readDpr(){ dpr = Math.min(window.devicePixelRatio || 1, 2); }

  function size(){
    var rect = canvas.getBoundingClientRect();
    W = Math.max(1, rect.width); H = Math.max(1, rect.height);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / GAP) + 1;
    rows = Math.ceil(H / GAP) + 1;
    offX = (W - (cols - 1) * GAP) / 2;   // centre the grid for even edges
    offY = (H - (rows - 1) * GAP) / 2;
  }

  function smoothstep(t){ return t * t * (3 - 2 * t); }

  /* --- text mask ---
     Per-line boxes of the hero copy, in canvas-local px. The cursor's darkening
     is suppressed inside these (with a feathered margin), so the dots never crowd
     the letters while the rest of the field reacts normally. getClientRects on a
     Range over each element yields one tight box per rendered line, so the mask
     hugs the actual text — not the element's full width — and reflows with it. */
  var maskRects = [];
  function computeMask(){
    var next = [];
    var crect = canvas.getBoundingClientRect();
    var els = hero.querySelectorAll(".greet-text, h1, .hero-act");
    for (var e = 0; e < els.length; e++){
      var range = document.createRange();
      range.selectNodeContents(els[e]);
      var rs = range.getClientRects();
      for (var i = 0; i < rs.length; i++){
        var r = rs[i];
        if (r.width < 2 || r.height < 2) continue;
        next.push({
          x: r.left - crect.left - MASK_PAD,
          y: r.top  - crect.top  - MASK_PAD,
          w: r.width  + MASK_PAD * 2,
          h: r.height + MASK_PAD * 2
        });
      }
    }
    maskRects = next;
  }
  /* 1 = dot sits over the text (fully suppress darkening), 0 = clear of it,
     feathered over MASK_FEATHER px so there is no hard edge in the dot field. */
  function maskAt(x, y){
    var best = 0;
    for (var i = 0; i < maskRects.length; i++){
      var m = maskRects[i];
      var dx = Math.max(m.x - x, x - (m.x + m.w), 0);
      var dy = Math.max(m.y - y, y - (m.y + m.h), 0);
      if (dx === 0 && dy === 0) return 1;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < MASK_FEATHER){
        var cov = 1 - smoothstep(d / MASK_FEATHER);
        if (cov > best){ best = cov; if (best >= 1) break; }
      }
    }
    return best;
  }

  /* static grid — used for reduced-motion, touch, and the initial paint */
  function drawStatic(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(20,20,20," + A_BASE + ")";
    for (var r = 0; r < rows; r++){
      var y = offY + r * GAP;
      for (var c = 0; c < cols; c++){
        ctx.beginPath();
        ctx.arc(offX + c * GAP, y, R_BASE, 0, 6.2832);
        ctx.fill();
      }
    }
  }

  /* --- interactive state --- */
  var tx = -9999, ty = -9999;   // target pointer (canvas-relative)
  var px = -9999, py = -9999;   // smoothed pointer
  var active = false, raf = 0;

  function draw(){
    px += (tx - px) * LERP;
    py += (ty - py) * LERP;

    // base layer — one fillStyle, cheap
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(20,20,20," + A_BASE + ")";
    for (var r = 0; r < rows; r++){
      var yb = offY + r * GAP;
      for (var c = 0; c < cols; c++){
        ctx.beginPath();
        ctx.arc(offX + c * GAP, yb, R_BASE, 0, 6.2832);
        ctx.fill();
      }
    }

    // influence layer — only the dots inside the cursor's reach get redrawn
    if (px > -9000){
      var c0 = Math.max(0, Math.floor((px - INFLUENCE - offX) / GAP));
      var c1 = Math.min(cols - 1, Math.ceil((px + INFLUENCE - offX) / GAP));
      var r0 = Math.max(0, Math.floor((py - INFLUENCE - offY) / GAP));
      var r1 = Math.min(rows - 1, Math.ceil((py + INFLUENCE - offY) / GAP));
      for (var rr = r0; rr <= r1; rr++){
        var yi = offY + rr * GAP, dy = yi - py;
        for (var cc = c0; cc <= c1; cc++){
          var xi = offX + cc * GAP, dx = xi - px;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist >= INFLUENCE) continue;
          var f = smoothstep(1 - dist / INFLUENCE);
          if (maskRects.length){ f *= 1 - maskAt(xi, yi); }   // let the text part the field
          if (f <= 0.002) continue;                           // masked dot stays at its faint base
          ctx.fillStyle = "rgba(20,20,20," + (A_BASE + (A_MAX - A_BASE) * f).toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(xi, yi, R_BASE + (R_MAX - R_BASE) * f, 0, 6.2832);
          ctx.fill();
        }
      }
    }

    var settled = Math.abs(tx - px) < 0.4 && Math.abs(ty - py) < 0.4;
    if (active || !settled){
      raf = requestAnimationFrame(draw);
    } else {
      drawStatic();   // land on a clean static grid, then idle
      raf = 0;
    }
  }

  function kick(){ if (!raf) raf = requestAnimationFrame(draw); }

  function onMove(e){
    // Listener is on window (not the max-width hero) so the effect reaches the full
    // viewport width. Coords are canvas-relative; the canvas is full-bleed 100vw.
    var rect = canvas.getBoundingClientRect();
    var y = e.clientY - rect.top;
    if (y < 0 || y > H){ onLeave(); return; }   // pointer not over the hero band → ease back
    tx = e.clientX - rect.left;                  // 0..W across the whole viewport
    ty = y;
    if (px < -9000){ px = tx; py = ty; }   // no first-frame sweep from infinity
    active = true;
    kick();
  }

  function onLeave(){
    active = false;
    tx = -9999; ty = -9999;   // pull the influence off-grid; dots ease back
    kick();
  }

  var bound = false;
  function bindPointer(){
    if (bound) return;
    bound = true;
    window.addEventListener("pointermove", onMove, { passive:true });
    document.addEventListener("pointerleave", onLeave);   // cursor leaves the window
    window.addEventListener("blur", onLeave);
    hero.addEventListener("pointerenter", computeMask);   // refresh text boxes on arrival (post-reveal/fonts)
  }
  function unbindPointer(){
    if (!bound) return;
    bound = false;
    window.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerleave", onLeave);
    window.removeEventListener("blur", onLeave);
    hero.removeEventListener("pointerenter", computeMask);
    onLeave();
  }

  function applyMode(){
    readDpr();
    size();
    computeMask();
    var interactive = mqFine.matches && !mqReduce.matches;
    if (interactive){
      drawStatic();
      bindPointer();
    } else {
      unbindPointer();
      drawStatic();            // calm, static dotted texture on touch / reduced-motion
    }
  }

  // react to resize and to live changes in the media queries
  var rt;
  window.addEventListener("resize", function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      readDpr(); size(); computeMask();
      if (!(mqFine.matches && !mqReduce.matches) || !active) drawStatic();
    }, 150);
  });
  function onMq(){ applyMode(); }
  (mqReduce.addEventListener ? mqReduce.addEventListener("change", onMq) : mqReduce.addListener(onMq));
  (mqFine.addEventListener   ? mqFine.addEventListener("change", onMq)   : mqFine.addListener(onMq));

  applyMode();
  // the hero copy reveals (translateY) and web fonts may reflow it — recompute the
  // mask once both have settled, and whenever fonts finish loading.
  setTimeout(computeMask, 1000);
  if (document.fonts && document.fonts.ready){ document.fonts.ready.then(computeMask); }
})();
</script>

<!-- ===================================================================
     Global circle cursor — a hairline ring trails the pointer across the
     whole page. The native cursor is normalized to a plain arrow (no I-beam
     over text) and a hand over clickable elements. Touch / reduced-motion opt
     out entirely (native cursor left untouched).
     =================================================================== -->
<script>
(function(){
  var mqReduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var mqFine   = window.matchMedia("(hover:hover) and (pointer:fine)");
  var root = document.documentElement;

  var ring = document.createElement("div");
  ring.className = "cursor-ring";
  ring.setAttribute("aria-hidden", "true");
  document.body.appendChild(ring);

  var INTERACTIVE = "a,button,[role=button],input,textarea,select,label,summary";
  var LERP = 0.2;

  var tx = -100, ty = -100;   // target (viewport coords)
  var x = -100, y = -100;     // smoothed
  var visible = false, raf = 0, primed = false;

  function loop(){
    x += (tx - x) * LERP;
    y += (ty - y) * LERP;
    ring.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0)";
    if (Math.abs(tx - x) > 0.3 || Math.abs(ty - y) > 0.3){
      raf = requestAnimationFrame(loop);
    } else {
      raf = 0;
    }
  }
  function kick(){ if (!raf) raf = requestAnimationFrame(loop); }

  function onMove(e){
    tx = e.clientX; ty = e.clientY;
    if (!primed){ x = tx; y = ty; primed = true; }   // no first-frame sweep
    if (!visible){ visible = true; ring.classList.add("is-visible"); }
    ring.classList.toggle("is-hover", !!(e.target && e.target.closest && e.target.closest(INTERACTIVE)));
    kick();
  }
  function hide(){ visible = false; ring.classList.remove("is-visible"); }

  var on = false;
  function enable(){
    if (on) return;
    on = true;
    root.classList.add("cursor-custom");
    window.addEventListener("pointermove", onMove, { passive:true });
    document.addEventListener("pointerleave", hide);
    window.addEventListener("blur", hide);
  }
  function disable(){
    if (!on) return;
    on = false;
    root.classList.remove("cursor-custom");
    window.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerleave", hide);
    window.removeEventListener("blur", hide);
    hide();
    primed = false;
  }

  function apply(){
    if (mqFine.matches && !mqReduce.matches) enable();
    else disable();
  }
  function bindMq(mq, fn){ mq.addEventListener ? mq.addEventListener("change", fn) : mq.addListener(fn); }
  bindMq(mqReduce, apply);
  bindMq(mqFine, apply);

  apply();
})();
</script>
